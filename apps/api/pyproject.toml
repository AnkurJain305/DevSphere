[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "devsphere-api"
version = "0.1.0"
description = "DevSphere API"
requires-python = ">=3.13"
dependencies = [
  "fastapi==0.165.0",
  "uvicorn==0.54.0",
  "pydantic==2.14.4",
  "pydantic-settings==2.16.3",
  "sqlalchemy[asyncio]==2.1.9",
  "asyncpg==0.32.0",
  "alembic==1.20.1",
]

[project.optional-dependencies]
dev = [
  "pytest==9.2.0",
  "pytest-asyncio==1.5.0",
  "httpx==0.28.1",
  "ruff==0.17.6",
  "mypy==2.4.1",
  "pre-commit==4.5.1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["app", "alembic", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
files = ["app", "alembic/env.py", "tests"]

[[tool.mypy.overrides]]
module = ["alembic.*"]
ignore_missing_imports = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
